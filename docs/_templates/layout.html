{% extends "!layout.html" %}

{% block body_tag %}<body{% if has_page_toc %} class="has-page-toc"{% endif %}>{% endblock %}

{% block extrahead %}
{{ super() }}
{% if has_page_toc %}
<script src="{{ pathto('_static/page-toc.js', resource=True) }}" defer></script>
{% endif %}
{% endblock %}
{% block footer -%}

<script>
    let closest;
    // Get the last part of the URL after the # symbol - should match the div id to display
    let id = window.location.hash.substring(1);
    let elem = document.getElementById(id);
    if (elem != null) {
        // Get the closest "details" element and open it
        closest = elem.closest("details");
        if (closest != null) closest.open = true;
    }
</script>

{%- endblock %}
